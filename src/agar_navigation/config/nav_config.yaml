global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.0
      footprint: "[[1.0, 0.8], [1.0, -0.8], [-1.0, -0.8], [-1.0, 0.8]]"
      resolution: 0.05 #0.05
      width: 30
      height: 30
      # origin_x: 25.0
      # origin_y: 25.0
      rolling_window: True
      track_unknown_space: False
      plugins: ["obstacle_layer", "inflation_layer"] #"static_layer", 
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan #camera_point_cloud #lidar_point_cloud
        # camera_point_cloud:
        #   topic: /zedx/zed_node/point_cloud/cloud_registered
        #   data_type: "PointCloud2"
        #   max_obstacle_height: 1.5 #3.0
        #   min_obstacle_height: 0.30
        #   obstacle_max_range: 10.0
        #   obstacle_min_range: 0.4
        #   raytrace_max_range: 10.0
        #   raytrace_min_range: 0.4
        #   clearing: True
        #   marking: True
        scan:
          topic: /zedx/zed_node/scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_max_range: 30.0
          raytrace_min_range: 0.6
          obstacle_max_range: 30.0
          obstacle_min_range: 0.6
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5 #3.0
        inflation_radius: 0.3 # 0.3 # 0.25 #2.5 #1.2 #0.55
        inflate_around_unknown: True
      always_send_full_costmap: True