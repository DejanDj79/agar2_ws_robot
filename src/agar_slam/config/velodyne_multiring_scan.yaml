velodyne_multiring_laserscan:
  ros__parameters:
    target_frame: base_footprint
    transform_tolerance: 0.05

    # Keep stable structures while rejecting the ground and high vegetation.
    min_height: 0.20
    max_height: 2.00

    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.007
    time_increment: 0.0
    scan_time: 0.10

    range_min: 0.70
    range_max: 15.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
