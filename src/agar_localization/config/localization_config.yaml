### navsat transform ###
navsat_transform:
  ros__parameters:
    frequency: 20.0
    delay: 0.0 # Seconds to wait before calculating the transform from GPS coordinates to your robot’s world frame.

    zero_altitude: false
    yaw_offset: 0.0

    broadcast_utm_transform: false
    publish_filtered_gps: false

    wait_for_datum: true
    # datum: [43.330890405343304, 21.893977363705066, 0.0] #  latitude, longitude, heading (in radians)
    # datum: [43.33112072916667, 21.890989195166668, 0.0]
    # datum: [43.33057862816666, 21.890321557666667, 0.0]

    # datum: [43.33100874425, 21.89109394616667, 0.0]

    # datum: [42.00609939691667, 21.48982421066667, 0.0]

    # datum: [43.330389261166665, 21.890178528916664, 0.0]
    datum: [44.829412176000005, 19.749630910249998, 0.0]
    # datum: [43.33098928183334, 21.891017097333332, 0.0]

    # datum: [42.007604251632976, 21.489645546679498] # Kamnik

### ekf config file ###
ekf_filter_node:
    ros__parameters:
        use_sim_time: false
        frequency: 20.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false
        debug_out_file: /home/nvidia/ros_data/logs/ekf_debug.txt
        publish_tf: true
        publish_acceleration: false
        reset_on_time_jump: true
        
        # map_frame: map                   # Defaults to "map" if unspecified
        odom_frame: odom                 # Defaults to "odom" if unspecified
        base_link_frame: base_footprint  # Defaults to "base_link" if unspecified
        world_frame: odom                # Defaults to the value of odom_frame if unspecified


        # Configuration IMU #/zed/zed_node/imu/data
        imu0: /imu/data
        imu0_config: [false, false, false,      # X,Y,Z
                      false, false, true,      # roll, pitch, yaw
                      false, false, false,      # X˙, Y˙, Z˙
                      false, false, false,      # roll˙, pitch˙, yaw˙
                      false, false, false]      # X˙˙, Y˙˙, Z˙˙
                      # false, false, true,      # roll˙, pitch˙, yaw˙
                      # false, false, true]      # X˙˙, Y˙˙, Z˙˙

        imu0_differential: false
        imu0_nodelay: false
        imu0_relative: false
        imu0_queue_size: 20


        # Configuration odom
        odom0: /odometry/gps
        odom0_config: [true,  true, false,
                    false, false, false,
                    false, false, false,
                    false, false, false,
                    false, false, false]

        odom0_differential: false
        odom0_nodelay: false
        odom0_relative: false
        odom0_queue_size: 20

        use_control: false
        stamped_control: false
        control_timeout: 0.2
        control_config: [true, false, false, false, false, true]
        acceleration_limits: [1.3, 0.0, 0.0, 0.0, 0.0, 3.4]
